[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mace-md-lab"
version = "0.2.0"
description = "Conservative MACE dynamics with specialized first derivatives and moving-atom benchmarks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mace-torch==0.3.16", "ase>=3.23", "numpy>=1.24", "torch>=2.2"]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x>=13", "triton>=3; platform_system == 'Linux'"]

[project.scripts]
mace-md-portable = "mace_md_lab.portable.benchmark:main"
mace-md-adjoint = "mace_md_lab.adjoint_bench:main"
mace-md-force-checks = "mace_md_lab.force_checks:main"
mace-md-reverse-profile = "mace_md_lab.reverse_profile:main"
mace-md-bench = "mace_md_lab.bench:main"
mace-md-committee = "mace_md_lab.committee:main"
mace-md-profile = "mace_md_lab.profile:main"

[tool.setuptools.packages.find]
where = ["src"]
